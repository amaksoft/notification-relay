[project]
name = "notifrelay-cli"
version = "0.1.0"
description = "Access-management CLI for notification-relay: device rules, subscriber grants/API keys, read-only webhook oversight."
requires-python = ">=3.11"
dependencies = [
    "firebase-admin>=7.5",
]

[project.scripts]
notifrelay = "notifrelay_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
